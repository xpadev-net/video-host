apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video-host

resources:
  - ../../base

# Pin application images to release versions; VOD is pinned by digest in base.
images:
  - name: ghcr.io/xpadev-net/video-host/backend
    newTag: v0.0.37
  - name: ghcr.io/xpadev-net/video-host/frontend
    newTag: v0.0.56
  - name: ghcr.io/xpadev-net/video-host/ffmpeg-worker
    newTag: v0.0.11

# レプリカ数のパッチ
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ffmpeg-worker
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vod
      spec:
        replicas: 2
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: video-host
      spec:
        tls:
          - hosts:
              - your-frontend-domain.com
            secretName: video-host-tls
        rules:
          - host: your-frontend-domain.com
            http:
              paths:
                - path: /vod
                  pathType: Prefix
                  backend:
                    service:
                      name: vod
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend
                      port:
                        number: 3000

# ConfigMap生成
configMapGenerator:
  # Backend
  - name: backend-config
    literals:
      - better-auth-url=https://your-frontend-domain.com
      - auth-trusted-origins=https://your-frontend-domain.com
      - auth-trusted-proxy-cidrs=CHANGE_ME_frontend_and_ingress_proxy_CIDRs
      - signup-enabled=false
      - password-auth-enabled=true
      - oidc-enabled=false
      - oidc-issuer-url=
      - oidc-client-id=
      - oidc-scope=openid profile email
      - oidc-display-name=SSO
      - oidc-auto-provision=true
      - oidc-allow-http=false
      - frontend-url=https://your-frontend-domain.com
      - cors-origin=https://your-frontend-domain.com
      - public-endpoints=
      - s3-tmp-bucket=video-tmp
      - s3-prod-bucket=video-prod
      - s3-region=ap-northeast-1
      - s3-endpoint=https://s3.ap-northeast-1.amazonaws.com
      # The VOD proxy reconstructs the signed bucket hostname from this bucket and endpoint.
      - s3-force-path-style=false
      - redis-url=redis://redis:6379
      - redis-sentinel-hosts=
      - redis-sentinel-name=
      - otel-endpoint=
      - otel-metrics-endpoint=
      - otel-service-name=video-host-backend

  # Frontend
  - name: frontend-config
    literals:
      - api-endpoint=
      - api-upstream-url=http://backend:3000
      - enable-comments=true
      - require-signup-code=false
      - site-name=Video Host
      - otel-endpoint=
      - otel-metrics-endpoint=
      - otel-service-name=video-host-frontend

  # FFmpeg Worker
  - name: ffmpeg-worker-config
    literals:
      - redis-url=redis://redis:6379
      - redis-sentinel-hosts=
      - redis-sentinel-name=
      - s3-tmp-bucket=video-tmp
      - s3-prod-bucket=video-prod
      - s3-region=ap-northeast-1
      - s3-endpoint=https://s3.ap-northeast-1.amazonaws.com
      - s3-force-path-style=false
      - backend-callback-url=http://backend:3000/api/internal/video/callback
      - vod-base-url=https://your-frontend-domain.com
      - poll-interval-ms=5000
      - min-disk-space-gb=1
      - job-timeout-seconds=7200
      - ffmpeg-threads=2
      - otel-endpoint=
      - otel-metrics-endpoint=
      - otel-service-name=video-host-ffmpeg-worker

  # VOD nginx config
  - name: vod-nginx-config
    files:
      - nginx.conf
