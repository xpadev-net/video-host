apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: ghcr.io/xpadev-net/video-host/backend:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            # Auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: password-salt
            - name: TOKEN_EXPIRY
              value: "604800"
            - name: SIGNUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: signup-enabled
            - name: SIGNUP_CODE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: signup-code
                  optional: true
            - name: PASSWORD_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: password-auth-enabled
                  optional: true
            # SSO (OpenID Connect)
            - name: OIDC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-enabled
                  optional: true
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-issuer-url
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-client-id
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: oidc-client-secret
                  optional: true
            - name: OIDC_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-redirect-uri
                  optional: true
            - name: OIDC_SCOPE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-scope
                  optional: true
            - name: OIDC_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-display-name
                  optional: true
            - name: OIDC_AUTO_PROVISION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-auto-provision
                  optional: true
            - name: OIDC_ALLOW_HTTP
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: oidc-allow-http
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: frontend-url
                  optional: true
            # CORS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: cors-origin
            - name: PUBLIC_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: public-endpoints
                  optional: true
            # S3
            - name: S3_TMP_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-tmp-bucket
            - name: S3_PROD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-prod-bucket
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-region
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-endpoint
                  optional: true
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-force-path-style
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: s3-secret-access-key
            # Redis
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: redis-url
            - name: REDIS_SENTINEL_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: redis-sentinel-hosts
                  optional: true
            - name: REDIS_SENTINEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: redis-sentinel-name
                  optional: true
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: redis-sentinel-password
                  optional: true
            # Video Processing
            - name: VOD_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: vod-base-url
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: callback-secret
            - name: VOD_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: vod-internal-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
