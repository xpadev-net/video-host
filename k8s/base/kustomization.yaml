apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video-host

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ffmpeg-worker/deployment.yaml
  - vod/deployment.yaml
  - vod/service.yaml
  - networking.yaml
  - availability.yaml

configMapGenerator:
  - name: vod-nginx-config
    files:
      - nginx.conf=vod/nginx.conf.template
      - render-nginx-config.sh=vod/render-nginx-config.sh

labels:
  - pairs:
      app.kubernetes.io/part-of: video-host
    includeSelectors: true
