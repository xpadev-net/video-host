apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/xpadev-net/video-host/frontend:v0.0.56
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: frontend-url
            - name: API_UPSTREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: api-upstream-url
            - name: VITE_API_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: api-endpoint
            - name: VITE_SITE_NAME
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: site-name
            # OpenTelemetry (metrics export is disabled when otel-endpoint is unset)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: otel-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: otel-metrics-endpoint
                  optional: true
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: otel-service-name
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
