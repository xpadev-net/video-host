apiVersion: apps/v1
kind: Deployment
metadata:
  name: vod
  labels:
    app.kubernetes.io/name: vod
    app.kubernetes.io/component: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vod
        app.kubernetes.io/component: streaming
    spec:
      initContainers:
        - name: prepare-nginx-config
          image: alpine:3.23
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache gettext openssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/tls.key \
                -out /etc/nginx/ssl/tls.crt \
                -subj "/CN=vod/O=video-host"
              if [ -n "$S3_ENDPOINT" ]; then
                S3_PROXY_SCHEME="${S3_ENDPOINT%%://*}"
                S3_PROXY_HOST="${S3_ENDPOINT#*://}"
                S3_PROXY_HOST="${S3_PROXY_HOST%%/*}"
              else
                S3_PROXY_SCHEME=https
                S3_PROXY_HOST="s3.${S3_REGION}.amazonaws.com"
              fi
              export S3_PROXY_SCHEME S3_PROXY_HOST
              envsubst '${VOD_INTERNAL_SECRET} ${S3_PROXY_SCHEME} ${S3_PROXY_HOST}' < /etc/nginx/template/nginx.conf > /etc/nginx/rendered/nginx.conf
          env:
            - name: VOD_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: vod-secrets
                  key: vod-internal-secret
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-endpoint
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: s3-region
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
            - name: nginx-config-template
              mountPath: /etc/nginx/template
              readOnly: true
            - name: nginx-config-rendered
              mountPath: /etc/nginx/rendered
      containers:
        - name: vod
          image: ghcr.io/xpadev-net/nginx-vod-module-docker:latest
          ports:
            - containerPort: 443
              protocol: TCP
          env:
            - name: VOD_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: vod-secrets
                  key: vod-internal-secret
          volumeMounts:
            - name: nginx-config-rendered
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-config-template
          configMap:
            name: vod-nginx-config
        - name: nginx-config-rendered
          emptyDir: {}
        - name: ssl-certs
          emptyDir: {}

