apiVersion: apps/v1
kind: Deployment
metadata:
  name: vod
  labels:
    app.kubernetes.io/name: vod
    app.kubernetes.io/component: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vod
        app.kubernetes.io/component: streaming
    spec:
      initContainers:
        - name: generate-certs
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/tls.key \
                -out /etc/nginx/ssl/tls.crt \
                -subj "/CN=vod/O=video-host"
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
      containers:
        - name: vod
          image: ghcr.io/xpadev-net/nginx-vod-module-docker:latest
          ports:
            - containerPort: 443
              protocol: TCP
          env:
            - name: VOD_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: vod-secrets
                  key: vod-internal-secret
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: vod-nginx-config
        - name: ssl-certs
          emptyDir: {}

