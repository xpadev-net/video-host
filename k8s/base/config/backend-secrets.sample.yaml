apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: video-host
type: Opaque
data:
  # Base64 エンコードされた値を設定してください
  # echo -n 'your-value' | base64
  jwt-secret: ""          # JWT署名用シークレット
  password-salt: ""       # パスワードハッシュ用ソルト
  signup-code: ""         # サインアップコード（オプション）
  s3-access-key-id: ""    # S3アクセスキー
  s3-secret-access-key: "" # S3シークレットキー
  redis-sentinel-password: "" # Redis Sentinelパスワード（オプション）
  callback-secret: ""     # FFmpegワーカーコールバック用シークレット
  vod-internal-secret: "" # VOD内部通信用シークレット
