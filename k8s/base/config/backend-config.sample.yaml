apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: video-host
data:
  # Auth
  signup-enabled: "false"
  # パスワード認証の有効/無効 (false にするとログイン・サインアップはSSOのみ)
  password-auth-enabled: "true"
  # SSO (OpenID Connect)
  oidc-enabled: "false"
  oidc-issuer-url: ""                                    # 例: https://authentik.example.com/application/o/video-host/
  oidc-client-id: ""
  oidc-redirect-uri: "https://api.your-domain.com/api/v4/auth/sso/callback"
  oidc-scope: "openid profile email"
  oidc-display-name: "SSO"                               # ログインボタンの表示名
  oidc-auto-provision: "true"                            # 初回SSOログイン時にユーザーを自動作成
  oidc-allow-http: "false"                               # http://のプロバイダを許可 (ローカル開発用のみ)
  # フロントエンドのベースURL (SSO完了後のリダイレクト先)
  frontend-url: "https://your-frontend-domain.com"
  # CORS (カンマ区切りで複数指定可能)
  cors-origin: "https://your-frontend-domain.com"
  public-endpoints: ""
  # S3
  s3-tmp-bucket: "video-tmp"
  s3-prod-bucket: "video-prod"
  s3-region: "ap-northeast-1"
  s3-endpoint: ""  # MinIO等を使う場合に設定
  s3-force-path-style: "false"
  # Redis
  redis-url: "redis://redis:6379"
  redis-sentinel-hosts: ""
  redis-sentinel-name: ""
  # Video Processing
  vod-base-url: "http://vod-server/vod"
  # OpenTelemetry (メトリクス送信先。空の場合は無効)
  otel-endpoint: ""  # 例: "http://otel-collector.otel-collector.svc.cluster.local:4318"
  otel-service-name: "video-host-backend"
