apiVersion: v1
kind: ConfigMap
metadata:
  name: vod-nginx-config
  namespace: video-host
data:
  nginx.conf: |
    user root;
    worker_processes auto;
    error_log /dev/stderr debug;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        # Temporary directories for distroless image
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        default_type application/octet-stream;

        # Basic MIME types for VOD streaming
        types {
            text/html html htm shtml;
            text/css css;
            application/javascript js;
            application/json json;
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            application/dash+xml mpd;
            video/webm webm;
            audio/mp4 m4a;
            audio/mpeg mp3;
        }

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        client_max_body_size 100M;

        # VOD module settings - Mapped mode
        vod_mode mapped;
        vod_upstream_location /mapping;
        vod_remote_upstream_location /proxy;
        vod_last_modified 'Sun, 19 Nov 2000 08:52:00 GMT';
        vod_last_modified_types *;
        vod_metadata_cache metadata_cache 256m;
        vod_response_cache response_cache 128m;
        vod_mapping_cache mapping_cache 5m;
        vod_manifest_segment_durations_mode accurate;
        vod_segment_duration 10000;
        vod_align_segments_to_key_frames on;

        gzip on;
        gzip_types application/vnd.apple.mpegurl;

        open_file_cache max=1000 inactive=5m;
        open_file_cache_valid 2m;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
        aio on;

        # Resolver for Kubernetes DNS
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;

        server {
            listen 80;
            server_name localhost;

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Backend mapping endpoint (use Kubernetes service name)
            location /mapping/vod/ {
                internal;
                # REPLACE_BACKEND_URL: バックエンドのサービス名を設定
                proxy_pass http://backend:3000/api/v4/vod/mapping/;
                proxy_set_header Host $http_host;
                # VOD_INTERNAL_SECRETは環境変数から取得するか、ここに直接設定
                proxy_set_header X-Vod-Internal-Secret "vod-internal-secret";
            }

            # Remote proxy for presigned S3 URLs
            # REPLACE_S3_ENDPOINT: S3/MinIOのエンドポイントを設定
            location ~ ^/proxy/(.+)$ {
                internal;
                set $backend_uri $1;

                # path 内の %3F を見つけたら左右に分割
                if ($backend_uri ~ "^(.*)%3F(.*)$") {
                    set $path_part $1;
                    set $qs_part $2;
                }

                # %3F が無ければそのまま、あれば ?qs を付ける
                # REPLACE_S3_HOST: S3/MinIOホストを設定 (例: minio:9000)
                set $s3_host "minio:9000";
                
                if ($qs_part = "") {
                    proxy_pass http://$s3_host/$backend_uri;
                }
                if ($qs_part != "") {
                    proxy_pass http://$s3_host/$path_part?$qs_part;
                }

                proxy_set_header Cookie "";
                proxy_set_header Authorization "";
                proxy_set_header Host $s3_host;
            }

            # VOD HLS endpoint
            location /vod/ {
                vod hls;
                vod_segment_duration 10000;
                
                # CORS headers
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range, Authorization' always;
                add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

                # Handle OPTIONS for CORS preflight
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range, Authorization';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain charset=UTF-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }

                alias /remote/;
            }
        }
    }
