apiVersion: v1
kind: Secret
metadata:
  name: ffmpeg-worker-secrets
  namespace: video-host
type: Opaque
data:
  # Base64 エンコードされた値を設定してください
  # echo -n 'your-value' | base64
  s3-access-key-id: ""        # S3アクセスキー
  s3-secret-access-key: ""    # S3シークレットキー
  redis-sentinel-password: "" # Redis Sentinelパスワード（オプション）
  callback-secret: ""         # Backend通知用シークレット
