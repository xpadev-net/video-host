name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  NODE_VERSION: '22.12.x'

jobs:
  # Backend CI
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, format, typecheck, test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }} (backend)
        run: pnpm -F @video-host/backend ${{ matrix.task }}

  # Frontend CI
  frontend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, format:check, typecheck, build]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm -F @video-host/backend build

      - name: Copy env placeholder
        run: cp app/frontend/docker/.env.placeholder app/frontend/.env

      - name: Run ${{ matrix.task }} (frontend)
        run: pnpm -F @video-host/frontend ${{ matrix.task }}

  # Worker CI
  ffmpeg-worker-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [typecheck]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm -F @video-host/backend build

      - name: Run ${{ matrix.task }} (worker)
        run: pnpm -F @video-host/ffmpeg-worker ${{ matrix.task }}
