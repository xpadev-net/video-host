services:
  redis:
    image: redis:7-alpine
    container_name: video-host-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    container_name: video-host-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_host}
      MYSQL_USER: ${MYSQL_USER:-video_host}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: video-host-object-storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in the root .env file}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the root .env file}
      S3_BUCKET: video-tmp
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  object-storage-init:
    image: amazon/aws-cli:2.36.37
    container_name: video-host-object-storage-init
    entrypoint: ["/bin/sh", "/scripts/object-storage-init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in the root .env file}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the root .env file}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-northeast-1}
      S3_ENDPOINT_URL: http://object-storage:8333
    volumes:
      - ./scripts/object-storage-init.sh:/scripts/object-storage-init.sh:ro
    depends_on:
      object-storage:
        condition: service_healthy

  vod-config:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/nginx/template/render-nginx-config.sh"]
    environment:
      VOD_INTERNAL_SECRET: ${VOD_INTERNAL_SECRET:?Set VOD_INTERNAL_SECRET in the root .env file}
      BACKEND_MAPPING_UPSTREAM: http://host.docker.internal:3001/api/v4/vod/mapping/
      LISTEN_PORT: "80"
      DNS_RESOLVER: 127.0.0.11
      S3_PROXY_SCHEME: http
      S3_PROXY_HOST: object-storage:8333
      S3_SIGNED_HOST: localhost:8333
      S3_PROD_BUCKET: video-prod
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION:-ap-northeast-1}
      S3_CA_BUNDLE: /etc/nginx/ssl/ca-certificates.crt
    volumes:
      - ./k8s/base/vod/nginx.conf.template:/etc/nginx/template/nginx.conf:ro
      - ./k8s/base/vod/render-nginx-config.sh:/etc/nginx/template/render-nginx-config.sh:ro
      - vod-config-rendered:/etc/nginx/rendered
      - vod-ca:/etc/nginx/ssl
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # VOD streaming server (nginx-vod-module)
  vod:
    image: ghcr.io/xpadev-net/nginx-vod-module-docker@sha256:f6adc8d8c94ee38726d3c2ffdcb637f3622f2404bbc4654242da4025970aa5ff
    platform: linux/amd64
    user: "101:101"
    container_name: video-host-vod
    ports:
      - "127.0.0.1:3002:80"
    command: ["-c", "/etc/nginx/rendered/nginx.conf", "-g", "daemon off;"]
    volumes:
      - vod-config-rendered:/etc/nginx/rendered:ro
      - vod-ca:/etc/nginx/ssl:ro
    depends_on:
      object-storage:
        condition: service_healthy
      vod-config:
        condition: service_completed_successfully
    extra_hosts:
      # Lets the container reach the backend when it runs directly on the host, including Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
  object-storage-data:
  vod-config-rendered:
  vod-ca:
