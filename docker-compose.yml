services:
  redis:
    image: redis:7-alpine
    container_name: video-host-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: video-host-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Create default buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: video-host-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/video-tmp --ignore-existing;
      mc mb myminio/video-prod --ignore-existing;
      mc anonymous set download myminio/video-prod;
      
      # Configure CORS for video-tmp bucket
      cat > /tmp/cors.json << 'EOF'
      {
        \"CORSRules\": [{
          \"AllowedOrigins\": [\"*\"],
          \"AllowedMethods\": [\"GET\", \"PUT\", \"POST\", \"DELETE\", \"HEAD\"],
          \"AllowedHeaders\": [\"*\"],
          \"ExposeHeaders\": [\"ETag\", \"x-amz-meta-*\"],
          \"MaxAgeSeconds\": 3600
        }]
      }
      EOF
      mc anonymous set upload myminio/video-tmp;
      mc cors set /tmp/cors.json myminio/video-tmp || echo 'CORS set via policy';
      mc cors set /tmp/cors.json myminio/video-prod || echo 'CORS set via policy';
      
      echo 'Buckets and CORS configured successfully';
      "

  # VOD streaming server (nginx-vod-module)
  vod:
    image: ghcr.io/xpadev-net/nginx-vod-module-docker:latest
    platform: linux/amd64
    container_name: video-host-vod
    ports:
      - "3002:80"
    volumes:
      - ./nginx:/etc/nginx:ro
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
